<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png">
<title>Cart tracker</title>
<style>
:root{--bg:#f4f5f3;--surface:#fff;--line:rgba(16,48,47,.12);--ink:#10302f;--ink2:#4d605e;--ink3:#74827f;--go:#0b6b35;--full:#8a4b00;--blue:#2563eb}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:400 16px/1.4 system-ui,-apple-system,Roboto,"Segoe UI",sans-serif;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-size:14px;font-weight:500;transition:background-color .12s}
button:active{background:#e6eae7}
button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
#app{display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto;background:var(--surface)}
header{flex:none;display:flex;align-items:center;gap:8px;padding:8px 8px 8px 16px;border-bottom:1px solid var(--line)}
header button{border:0;height:36px;min-width:48px;padding:0 8px;color:var(--ink2);font-variant-numeric:tabular-nums}
header b{font-size:18px;font-weight:600}
#clock{margin-right:auto;font-size:14px;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
#mapwrap{flex:1;min-height:120px;position:relative;overflow:hidden;touch-action:none;background:#f8f1cf;user-select:none;-webkit-user-select:none}
#base,#c{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#tools{position:absolute;right:12px;top:12px}
#tools button{display:grid;place-items:center;width:44px;height:44px;padding:0}
#toast{position:absolute;left:12px;right:68px;top:12px;background:var(--ink);color:#fff;font-size:14px;padding:8px 12px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}
#sheet{flex:none;padding:16px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;flex-direction:column}
#next{display:flex;align-items:center;gap:16px;min-height:56px}
#strip{display:block;width:100%;height:56px;margin:8px 0 4px}
#key{display:flex;gap:16px;font-size:12px;color:var(--ink3);padding-bottom:12px}
#key span{display:flex;align-items:center;gap:6px}
#key i{width:10px;height:10px;border-radius:50%;background:#12924a}
#key i.f{background:none;border:2px solid #E08A00}
#cd{font-size:48px;font-weight:500;line-height:1;color:var(--go);font-variant-numeric:tabular-nums;min-width:120px}
#next.none #cd{color:var(--ink3)}
#nt{font-size:14px;font-weight:500}
#ns{font-size:14px;color:var(--ink2);min-height:40px}
.row{display:flex;align-items:center;gap:12px;min-height:44px;border-top:1px solid var(--line);font-size:16px}
.row .dot{flex:none;width:12px;height:12px;border-radius:50%;background:var(--blue)}
#trip .dot{background:#dc2626}
#trip.none .dot{background:none;border:2px solid var(--ink3)}
#mel,#dl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#trip.none #dl{color:var(--ink2)}
.row button{flex:none;height:36px;padding:0 12px}
#trip.none #clear{display:none}
#list{display:none;list-style:none;margin:0;padding:0;font-size:14px;min-height:64px;border-top:1px solid var(--line)}
@media (min-height:800px){#list{display:block}}
#list li{display:flex;align-items:center;gap:8px;height:32px;font-variant-numeric:tabular-nums}
#list li b{margin-left:auto;font-weight:500}
#list li.f{color:var(--ink3)}
.tag{font-size:13px;color:var(--go)}
.tag.n{color:var(--full)}
#foot{font-size:12px;color:var(--ink3);padding-top:8px;border-top:1px solid var(--line)}
@media (max-height:640px){#key{display:none}#cd{font-size:40px}}
@media (orientation:landscape) and (max-height:520px){
  #app{display:grid;grid-template-columns:1fr 320px;grid-template-rows:auto 1fr;max-width:none}
  header{grid-column:1/3}
  #sheet{border-top:0;border-left:1px solid var(--line);overflow:hidden}
}
</style>
</head>
<body>
<div id="app">
  <header><b>Cart tracker</b><span id="clock"></span><button id="spd" aria-label="Simulation speed">12×</button><button id="pause">Pause</button></header>
  <div id="mapwrap">
    <canvas id="base"></canvas><canvas id="c"></canvas>
    <div id="tools"><button id="fit" aria-label="Show whole route"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg></button></div>
    <div id="toast" role="status"></div>
  </div>
  <div id="sheet">
    <div id="next" class="none"><div id="cd">--:--</div><div><div id="nt">Next empty cart</div><div id="ns"></div></div></div>
    <canvas id="strip" aria-hidden="true"></canvas>
    <div id="key"><span><i></i>Empty</span><span><i class="f"></i>Full</span><span>Top row runs to B, bottom row to A</span></div>
    <div id="me" class="row"><span class="dot"></span><span id="mel"></span><button id="gps">Locate me</button></div>
    <div id="trip" class="row none"><span class="dot"></span><span id="dl">Tap a road to set a destination</span><button id="clear">Clear</button></div>
    <ul id="list"></ul>
    <div id="foot"></div>
  </div>
</div>
<script src="drawings/drawing.js"></script>

function setNet(net,a,b,v){
  N=net.N;A_NODE=a;B_NODE=b;V_NODE=v;
  E=(()=>{let es=net.E.slice();for(;;){const deg={};es.forEach(e=>{deg[e[0]]=(deg[e[0]]||0)+1;deg[e[1]]=(deg[e[1]]||0)+1});
    const keep=es.filter(e=>[e[0],e[1]].every(k=>deg[k]>1||k===a||k===b||k===v));if(keep.length===es.length)return es;es=keep;}})();
  adj={};E.forEach(e=>{adj[e[0]]=adj[e[0]]||[];adj[e[1]]=adj[e[1]]||[];});

  E.forEach(([p,q])=>{const d=dist(p,q);adj[p].push([q,d]);adj[q].push([p,d]);});
}

const ekey=(a,b)=>a<b?a+'|'+b:b+'|'+a;
function dijkstra(s,wf,stop){ // wf(edgeKey) = weight multiplier; stop = node to end the search at
  const D={},P={},Q=new Set(NODES);NODES.forEach(k=>D[k]=Infinity);D[s]=0;
  while(Q.size){let u=null;Q.forEach(k=>{if(u===null||D[k]<D[u])u=k});Q.delete(u);if(D[u]===Infinity||u===stop)break;
    adj[u].forEach(([v,d])=>{const nd=D[u]+d*(wf?wf(ekey(u,v)):1);if(nd<D[v]){D[v]=nd;P[v]=u}});}

// shortcut: paths join only at their ends (to the nearest point of another path), not where two paths cross mid-way; split the path at the crossing when drawing
function fromDrawing(d){
  if(!d||!d.A||!d.B||!Array.isArray(d.paths))return null;
  const N={},E=[],ids=[],ps=d.paths.filter(p=>p.length>1).map(p=>p.filter((q,j)=>j===0||j===p.length-1||Math.hypot(q[0]-p.k[0],q[1]-p.k[1])>=6?(p.k=q,true):false));

  const near=(q,skip)=>{let b=null,bd=Infinity;ids.forEach(([k,i])=>{const dd=Math.hypot(N[k][0]-q[0],N[k][1]-q[1]);if(i!==skip&&dd<bd){bd=dd;b=k}});return [b,bd];};
  ps.forEach((p,i)=>[0,p.length-1].forEach(j=>{const [k,dd]=near(p[j],i);if(dd<JOIN)E.push(['p'+i+'_'+j,k]);}));

function mkRoute(nodes){
  const pts=nodes.map(k=>N[k]),cum=[0],rad=[0];
  for(let i=1;i<pts.length;i++)cum.push(cum[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));
  for(let i=1;i<pts.length-1;i++)rad.push(Math.min(CORNER,(cum[i]-cum[i-1])*.45,(cum[i+1]-cum[i])*.45));

// position at distance s along the route; corners are quadratic curves that stay inside the road width

function snap(x,y){

    let t=((x-p[0])*dx+(y-p[1])*dy)/(l2||1);t=Math.max(0,Math.min(1,t));
    const px=p[0]+dx*t,py=p[1]+dy*t,d=Math.hypot(x-px,y-py);
    if(!best||d<best.d)best={a,b,t,x:px,y:py,d};});
  return best;
}
function label(sn){let b=null,bd=70;for(const k in DATA.net.N){const q=DATA.net.N[k],d=Math.hypot(q[0]-sn.x,q[1]-sn.y);if(NAMES[k]&&d<bd){bd=d;b=k}}return b?NAMES[b]:'the cart road';}

    if(a===sn.a&&b===sn.b)d=r.cum[i]+sn.t*seg; else if(a===sn.b&&b===sn.a)d=r.cum[i]+(1-sn.t)*seg;
    if(d!==null&&d>=s0)return d;
  }
  return null;
}

    if(Math.abs(la-a.lat)>GPS.box||Math.abs(lo-a.lon)>GPS.box||t<-.15||t>1.15){fail('You seem to be outside the campus');return;}
    btn.textContent='Locate me';
    const r=gpsRoute,p=posAt(r,Math.max(0,Math.min(1,t))*r.len);
    setMe(snap(p.x,p.y));toast('Roughly near '+label(me));
  },err=>fail('Could not get your location'),{enableHighAccuracy:true,timeout:10000});
};
</script>
<script>if("serviceWorker"in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{})</script>
