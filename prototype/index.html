<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f8f6f1">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png">
<title>LPU CartNet</title>
<style>
:root{--bg:#f8f6f1;--surface:#fff;--ink:#1c1917;--ink2:#57534e;--ink3:#a8a29e;--line:#e7e2d9;--go:#15803d;--gobg:#e8f5ec;--maroon:#6b1d12;--mono:ui-monospace,"Roboto Mono","SF Mono",Menlo,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:400 15px/1.4 system-ui,-apple-system,Roboto,"Segoe UI",sans-serif;overflow:hidden;overscroll-behavior:none}
button,select{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid var(--maroon);outline-offset:2px}
#app{display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto;background:var(--bg)}
header{flex:none;display:flex;align-items:center;gap:12px;padding:12px 16px}
.logo{flex:none;display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--ink);color:#fff}
.ttl{flex:1;min-width:0;line-height:1.25}
.ttl b{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:600}
.ttl b i{width:6px;height:6px;border-radius:50%;background:var(--go)}
.ttl small{font-size:13px;color:var(--ink2)}
.pill{flex:none;display:flex;align-items:center;gap:6px;height:28px;padding:0 12px;border:1px solid var(--line);border-radius:14px;background:var(--surface);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.pill i{width:6px;height:6px;border-radius:50%;background:var(--go)}
#destrow{flex:none;display:flex;align-items:center;gap:8px;padding:12px 16px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
#destrow label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
#psel,#dsel{flex:1;min-width:0;height:40px;padding:0 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:15px;font-weight:500}
#mapwrap{flex:1;min-height:160px;position:relative;overflow:hidden;touch-action:none;background:#f3efe6;user-select:none;-webkit-user-select:none}
#map,#c{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#c{pointer-events:none}
#osm{position:absolute;left:8px;bottom:22px;font-size:10px;color:var(--ink2);background:rgba(255,255,255,.7);padding:1px 6px;border-radius:4px;pointer-events:none}
#legend{position:absolute;left:12px;top:12px;display:flex;gap:16px;height:32px;padding:0 12px;align-items:center;border:1px solid var(--line);border-radius:16px;background:var(--surface);font-size:13px;color:var(--ink2);pointer-events:none}
#legend span{display:flex;align-items:center;gap:8px}
#legend i{width:8px;height:8px;border-radius:50%;background:var(--go)}
#legend i.f{background:#78716c}
#tools{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:12px}
#tools button{display:grid;place-items:center;width:44px;height:44px;padding:0;border:1px solid var(--line);border-radius:50%;background:var(--surface);font:500 12px var(--mono)}
#tools button:active{background:#efeae2}
#pause{color:#d97706}
#gps.busy{opacity:.5}
#gps.on{color:#2563eb;border-color:#2563eb}
.logo{cursor:pointer;border:0;padding:0}
#dev{position:absolute;left:12px;right:68px;bottom:44px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px;border:1px dashed #6b1d12;border-radius:12px;background:rgba(255,255,255,.94);font-size:12px}
#dev[hidden]{display:none}
#dev button{height:36px;padding:0 12px;border:1px solid var(--line);border-radius:18px;background:var(--surface);font-size:13px}
#dev button.on{background:#6b1d12;color:#fff;border-color:#6b1d12}
#devc{flex-basis:100%;font:11px var(--mono);color:var(--ink2)}
#toast{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);max-width:calc(100% - 24px);background:rgba(28,25,23,.82);color:#fff;font-size:13px;padding:8px 16px;border-radius:16px;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}
#sheet{flex:none;position:relative;margin-top:-16px;padding:14px 16px calc(12px + env(safe-area-inset-bottom));background:var(--surface);border-radius:20px 20px 0 0;display:flex;flex-direction:column}
#grab{position:absolute;left:50%;top:0;width:88px;height:28px;margin-left:-44px;padding:0;border:0;background:none;touch-action:none}
#grab:before{content:"";position:absolute;left:24px;top:8px;width:40px;height:4px;border-radius:2px;background:var(--ink3)}
#sheet #trip,#sheet #foot{display:none}
#destrow,header .pill{display:none}   /* hidden: tap the map to pick your place, long-press for a destination */
#sheet.min .hd,#sheet.min #list,#sheet.min #ns,#sheet.min #rd{display:none}
#sheet.min{padding-bottom:calc(8px + env(safe-area-inset-bottom))}
#next{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding-bottom:8px}
#chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 8px;border-radius:6px;background:var(--gobg);color:var(--go);font-size:13px;font-weight:500}
#chip:before{content:"";width:5px;height:5px;border-radius:50%;background:var(--go)}
#next.none #chip{background:#f1eee8;color:var(--ink2)}#next.none #chip:before{background:var(--ink3)}
#via{margin-left:8px;font-size:13px;color:var(--ink2)}
.big{display:flex;align-items:baseline;gap:8px;margin-top:4px}
#cd{font:600 38px/1.1 system-ui,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
#next.none #cd{color:var(--ink3)}
.big small{font-size:14px;color:var(--ink2)}
#ns,#rd{font-size:13px;color:var(--ink2)}
.r{text-align:right;flex:none}
.lbl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
#rt{font:600 24px/1.2 system-ui,sans-serif;font-variant-numeric:tabular-nums}
#trip{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:14px;color:var(--ink2)}
#dl{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dl b{font-weight:500;color:var(--ink)}
#km{flex:none;font:13px var(--mono);color:var(--ink)}
.hd{display:flex;justify-content:space-between;padding:8px 0 2px;font-size:12px;color:var(--ink2)}
.hd span:first-child{letter-spacing:.06em;text-transform:uppercase}
#list{list-style:none;margin:0;padding:0;min-height:44px}
#list li:nth-child(n+2){display:none}
#list li{display:grid;grid-template-columns:16px 1fr auto;column-gap:8px;align-items:center;height:44px;padding:0 12px;border-radius:8px}
#list li.best{background:var(--bg)}
#list li>i{width:6px;height:6px;border-radius:50%;background:var(--go)}
#list li.f{color:var(--ink3)}#list li.f>i{background:var(--ink3)}
#list .n{font-size:15px}#list .n em{font-style:normal;font-size:12px;margin-left:8px;color:var(--go)}
#list li.f .n em{color:var(--ink3)}
#list .s{font-size:13px;color:var(--ink2)}#list li.f .s{color:var(--ink3)}
#list .e{text-align:right;font:14px var(--mono)}#list .e small{display:block;font:11px system-ui,sans-serif;color:var(--ink3)}
#foot{display:flex;justify-content:space-between;align-items:center;padding-top:8px;margin-top:4px;border-top:1px solid var(--line);font-size:13px;color:var(--ink2)}
#foot span:first-child{display:flex;align-items:center;gap:8px}
#foot i{width:6px;height:6px;border-radius:50%;background:var(--go)}
#sim{font:13px var(--mono);color:var(--ink)}
@media (max-height:640px){.hd,#list{display:none}#cd{font-size:36px}}
@media (orientation:landscape) and (max-height:520px){
  #app{display:grid;grid-template-columns:1fr 340px;grid-template-rows:auto auto 1fr;max-width:none}
  header,#destrow{grid-column:1/3}
  #sheet{margin:0;border-radius:0;border-left:1px solid var(--line);overflow:hidden}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="logo" id="logo" aria-label="Developer options"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 3v4M12 17v4M3 12h4M17 12h4"/></svg></button>
    <div class="ttl"><b>LPU CartNet<i></i></b><small id="stops"></small></div>
    <span class="pill"><i></i>Simulation</span>
  </header>
  <div id="destrow"><label for="psel">From</label>
    <select id="psel"><option value="gps">My location</option><option value="A">Main Stop</option><option value="B">2nd Stop</option><option value="x" hidden></option></select>
    <label for="dsel">To</label>
    <select id="dsel"><option value="">Anywhere</option><option value="A">Main Stop</option><option value="V">Stop 54</option><option value="B">2nd Stop</option><option value="x" hidden></option></select>
  </div>
  <div id="mapwrap">
    <div id="map"></div><canvas id="c"></canvas>
    <div id="osm">&copy; OpenStreetMap contributors</div>
    <div id="legend"><span><i></i>Available</span><span><i class="f"></i>Full</span></div>
    <div id="tools">
      <button id="gps" aria-label="Live location on or off"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
      <button id="fit" aria-label="Show whole route"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg></button>
      <button id="d3" aria-label="Switch between 3D and flat map">2D</button>
      <button id="spd" aria-label="Simulation speed">12x</button>
      <button id="pause" aria-label="Pause simulation"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path id="pico" d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg></button>
    </div>
    <div id="dev" hidden><b>Developer</b><button id="devA">Place Point A</button><button id="devB">Place Point B</button><button id="devR">Reset</button><button id="devX">Close</button><span id="devc"></span></div>
    <div id="toast" role="status"></div>
  </div>
  <div id="sheet">
    <button id="grab" aria-label="Show less" aria-expanded="true"></button>
    <div id="next" class="none">
      <div><div><span id="chip"></span><span id="via"></span></div><div class="big"><span id="cd">--:--</span><small>min wait</small></div><div id="ns"></div></div>
      <div class="r"><div class="lbl">Ride time</div><div id="rt">--:--</div><div id="rd"></div></div>
    </div>
    <div id="trip"><span id="dl"></span><span id="km"></span></div>
    <div class="hd"><span>Upcoming carts</span><span>simulated</span></div>
    <ul id="list"></ul>
    <div id="foot"><span><i></i>Simulation, not live tracking</span><span id="sim"></span></div>
  </div>
</div>
<script src="vendor/maplibre-gl.js"></script>
<script src="map/campus-osm.js"></script>
<script src="map/cart-route.js"></script>
<script src="app.js"></script>
<script>if("serviceWorker"in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{})</script>
</body>
</html>
