<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png">
<title>Cart tracker</title>
<style>
:root{--bg:#f4f5f3;--surface:#fff;--line:rgba(16,48,47,.12);--ink:#10302f;--ink2:#4d605e;--ink3:#74827f;--go:#0b6b35;--full:#8a4b00;--blue:#2563eb}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:400 16px/1.4 system-ui,-apple-system,Roboto,"Segoe UI",sans-serif;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-size:14px;font-weight:500;transition:background-color .12s}
button:active{background:#e6eae7}
button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
#app{display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto;background:var(--surface)}
header{flex:none;display:flex;align-items:baseline;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
header b{font-size:18px;font-weight:600}
#clock{margin-left:auto;font-size:14px;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
#mapwrap{flex:1;min-height:120px;position:relative;overflow:hidden;touch-action:none;background:#f3e6a8;user-select:none;-webkit-user-select:none}
canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#tools{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
#tools button{border:0;border-radius:0;height:44px;min-width:64px;padding:0 12px;font-variant-numeric:tabular-nums}
#tools button+button{border-top:1px solid var(--line)}
#legend{position:absolute;left:12px;bottom:12px;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px;color:var(--ink2);pointer-events:none}
#legend span{display:flex;align-items:center;gap:8px;height:20px}
#legend i{flex:none;width:16px;height:8px;border-radius:4px}
#toast{position:absolute;left:12px;right:88px;top:12px;background:var(--ink);color:#fff;font-size:14px;padding:8px 12px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}
#sheet{flex:none;padding:16px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;flex-direction:column}
#next{display:flex;align-items:center;gap:16px;min-height:56px;margin-bottom:12px}
#cd{font-size:48px;font-weight:500;line-height:1;color:var(--go);font-variant-numeric:tabular-nums;min-width:120px}
#next.none #cd{color:var(--ink3)}
#nt{font-size:14px;font-weight:500}
#ns{font-size:14px;color:var(--ink2);min-height:40px}
.row{display:flex;align-items:center;gap:12px;min-height:44px;border-top:1px solid var(--line);font-size:16px}
.row .dot{flex:none;width:12px;height:12px;border-radius:50%;background:var(--blue)}
#trip .dot{background:#dc2626}
#trip.none .dot{background:none;border:2px solid var(--ink3)}
#mel,#dl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#trip.none #dl{color:var(--ink2)}
.row button{flex:none;height:36px;padding:0 12px}
#trip.none #clear{display:none}
#list{list-style:none;margin:0;padding:0;font-size:14px;min-height:64px;border-top:1px solid var(--line)}
#list li{display:flex;align-items:center;gap:8px;height:32px;font-variant-numeric:tabular-nums}
#list li b{margin-left:auto;font-weight:500}
#list li.f{color:var(--ink3)}
.tag{font-size:13px;color:var(--go)}
.tag.n{color:var(--full)}
#foot{font-size:12px;color:var(--ink3);padding-top:8px;border-top:1px solid var(--line)}
@media (max-height:640px){#list,#legend{display:none}#cd{font-size:40px}}
@media (orientation:landscape) and (max-height:520px){
  #app{display:grid;grid-template-columns:1fr 320px;grid-template-rows:auto 1fr;max-width:none}
  header{grid-column:1/3}
  #sheet{border-top:0;border-left:1px solid var(--line);overflow:hidden}
}
</style>
</head>
<body>
<div id="app">
  <header><b>Cart tracker</b><span id="clock"></span></header>
  <div id="mapwrap">
    <canvas id="c"></canvas>
    <div id="tools">
      <button id="spd" aria-label="Simulation speed">12×</button>
      <button id="pause">Pause</button>
      <button id="fit">Fit</button>
    </div>
    <div id="legend">
      <span><i style="background:#12924a"></i>Empty, will pass you</span>
      <span><i style="background:#E08A00;opacity:.6"></i>Full</span>
      <span><i style="background:#12924a;opacity:.4"></i>Not passing you</span>
    </div>
    <div id="toast" role="status"></div>
  </div>
  <div id="sheet">
    <div id="next" class="none"><div id="cd">--:--</div><div><div id="nt">Next empty cart</div><div id="ns"></div></div></div>
    <div id="me" class="row"><span class="dot"></span><span id="mel"></span><button id="gps">Locate me</button></div>
    <div id="trip" class="row none"><span class="dot"></span><span id="dl">Tap a road to set a destination</span><button id="clear">Clear</button></div>
    <ul id="list"></ul>
    <div id="foot"></div>
  </div>
</div>
<script src="drawings/drawing.js"></script>

// Carts only use roads that lie on some A-B route, so dead-end spurs are pruned from the network.

let N,E,adj,NODES,A_NODE,B_NODE,V_NODE;
function setNet(net,a,b,v){
  N=net.N;A_NODE=a;B_NODE=b;V_NODE=v;
  E=(()=>{let es=net.E.slice();for(;;){const deg={};es.forEach(e=>{deg[e[0]]=(deg[e[0]]||0)+1;deg[e[1]]=(deg[e[1]]||0)+1});
    const keep=es.filter(e=>[e[0],e[1]].every(k=>deg[k]>1||k===a||k===b||k===v));if(keep.length===es.length)return es;es=keep;}})();
  adj={};E.forEach(e=>{adj[e[0]]=adj[e[0]]||[];adj[e[1]]=adj[e[1]]||[];});
  NODES=Object.keys(adj);
  E.forEach(([p,q])=>{const d=dist(p,q);adj[p].push([q,d]);adj[q].push([p,d]);});
}
const dist=(a,b)=>Math.hypot(N[a][0]-N[b][0],N[a][1]-N[b][1]);
const ekey=(a,b)=>a<b?a+'|'+b:b+'|'+a;
function dijkstra(s,wf){ // wf(edgeKey) = weight multiplier
  const D={},P={},Q=new Set(NODES);NODES.forEach(k=>D[k]=Infinity);D[s]=0;
  while(Q.size){let u=null;Q.forEach(k=>{if(u===null||D[k]<D[u])u=k});Q.delete(u);if(D[u]===Infinity)break;
    adj[u].forEach(([v,d])=>{const nd=D[u]+d*(wf?wf(ekey(u,v)):1);if(nd<D[v]){D[v]=nd;P[v]=u}});}
  return {D,P};
}
function path(s,t,wf){const {P}=dijkstra(s,wf);const r=[t];while(r[0]!==s){if(P[r[0]]===undefined)return null;r.unshift(P[r[0]]);}return r;}
// network from a drawing saved by draw.html: {A,B,V,paths} in map pixels. Every drawn point is a node.
// shortcut: paths join only at their ends (to the nearest point of another path), not where two paths cross mid-way; split the path at the crossing when drawing
function fromDrawing(d){
  if(!d||!d.A||!d.B||!Array.isArray(d.paths))return null;
  const N={},E=[],ids=[],ps=d.paths.filter(p=>p.length>1).map(p=>p.filter((q,j)=>j===0||j===p.length-1||Math.hypot(q[0]-p.k[0],q[1]-p.k[1])>=6?(p.k=q,true):false));
  ps.forEach((p,i)=>p.forEach((q,j)=>{const k='p'+i+'_'+j;N[k]=q;ids.push([k,i]);if(j)E.push(['p'+i+'_'+(j-1),k]);}));
  const near=(q,skip)=>{let b=null,bd=Infinity;ids.forEach(([k,i])=>{const dd=Math.hypot(N[k][0]-q[0],N[k][1]-q[1]);if(i!==skip&&dd<bd){bd=dd;b=k}});return [b,bd];};
  ps.forEach((p,i)=>[0,p.length-1].forEach(j=>{const [k,dd]=near(p[j],i);if(dd<JOIN)E.push(['p'+i+'_'+j,k]);}));
  return ids.length?{N,E,a:near(d.A)[0],b:near(d.B)[0],v:d.V?near(d.V)[0]:null}:null;
}

const via=(a,b,wf)=>V_NODE?path(a,V_NODE,wf).concat(path(V_NODE,b,wf).slice(1)):path(a,b,wf);
const mainPath=via(A_NODE,B_NODE);
const mainKeys=new Set(mainPath.slice(1).map((k,i)=>ekey(mainPath[i],k)));

// ---------- routes with rounded corners ----------
function mkRoute(nodes){
  const pts=nodes.map(k=>N[k]),cum=[0],rad=[0];
  for(let i=1;i<pts.length;i++)cum.push(cum[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));
  for(let i=1;i<pts.length-1;i++)rad.push(Math.min(CORNER,(cum[i]-cum[i-1])*.45,(cum[i+1]-cum[i])*.45));
  rad.push(0);
  return {nodes,pts,cum,rad,len:cum[cum.length-1]};
}
function randomRoute(from,to){
  const w={},jit=k=>w[k]===undefined?(w[k]=1+Math.random()*.15):w[k];
  if(Math.random()<P_DETOUR){ // a different path: make the usual roads look longer so another loop gets chosen
    const pen=1.4+Math.random()*1.6;return mkRoute(via(from,to,k=>jit(k)*(mainKeys.has(k)&&Math.random()<.8?pen:1)));
  }
  return mkRoute(via(from,to,jit));
}
// position at distance s along the route; corners are quadratic curves that stay inside the road width
function posAt(r,s){
  s=Math.max(0,Math.min(r.len,s));let i=1;while(i<r.cum.length-1&&r.cum[i]<s)i++;
  let v=-1,u=0;
  if(r.rad[i]>0&&s>r.cum[i]-r.rad[i]){v=i;u=(s-(r.cum[i]-r.rad[i]))/(2*r.rad[i]);}
  else if(r.rad[i-1]>0&&s<r.cum[i-1]+r.rad[i-1]){v=i-1;u=(s-(r.cum[v]-r.rad[v]))/(2*r.rad[v]);}
  if(v<0){const t=(s-r.cum[i-1])/((r.cum[i]-r.cum[i-1])||1),p=r.pts[i-1],q=r.pts[i];
    return {x:p[0]+(q[0]-p[0])*t,y:p[1]+(q[1]-p[1])*t,ang:Math.atan2(q[1]-p[1],q[0]-p[0])};}
  const V=r.pts[v],P=r.pts[v-1],Q=r.pts[v+1],R=r.rad[v],l1=r.cum[v]-r.cum[v-1],l2=r.cum[v+1]-r.cum[v];
  const ax=V[0]+(P[0]-V[0])*R/l1,ay=V[1]+(P[1]-V[1])*R/l1,bx=V[0]+(Q[0]-V[0])*R/l2,by=V[1]+(Q[1]-V[1])*R/l2,w=1-u;
  return {x:w*w*ax+2*w*u*V[0]+u*u*bx,y:w*w*ay+2*w*u*V[1]+u*u*by,ang:Math.atan2(w*(V[1]-ay)+u*(by-V[1]),w*(V[0]-ax)+u*(bx-V[0]))};
}

let carts=[],nextId=1,spawnT={A:0,B:0};
function spawn(dir,progress){
  const r=randomRoute(dir==='A'?A_NODE:B_NODE,dir==='A'?B_NODE:A_NODE);
  const full=Math.random()<P_FULL,s=(progress||0)*r.len;
  let pickupAt=(!full&&Math.random()<P_PICKUP)?r.len*(0.2+Math.random()*0.65):null;
  const c={id:nextId++,dir,route:r,s,v:PX_S*(0.85+Math.random()*0.3),full,pickupAt,flash:0,ok:false,eta:null};
  if(pickupAt!==null&&pickupAt<=s){c.full=true;c.pickupAt=null;}
  carts.push(c);
}
// time until the next cart leaves: drawn from the team's stopwatch gaps

// ---------- snapping to roads ----------
function snap(x,y){
  let best=null;
  E.forEach(([a,b])=>{const p=N[a],q=N[b],dx=q[0]-p[0],dy=q[1]-p[1],l2=dx*dx+dy*dy;
    let t=((x-p[0])*dx+(y-p[1])*dy)/(l2||1);t=Math.max(0,Math.min(1,t));
    const px=p[0]+dx*t,py=p[1]+dy*t,d=Math.hypot(x-px,y-py);
    if(!best||d<best.d)best={a,b,t,x:px,y:py,d};});
  return best;
}
function label(sn){let b=null,bd=70;for(const k in DATA.net.N){const q=DATA.net.N[k],d=Math.hypot(q[0]-sn.x,q[1]-sn.y);if(NAMES[k]&&d<bd){bd=d;b=k}}return b?NAMES[b]:'the cart road';}
const toB=sn=>Math.min(distB[sn.a]+sn.t*dist(sn.a,sn.b),distB[sn.b]+(1-sn.t)*dist(sn.a,sn.b));
// distance along route r (from its start) where point sn lies, at or ahead of s0
function routeDist(r,sn,s0){
  for(let i=0;i<r.nodes.length-1;i++){
    const a=r.nodes[i],b=r.nodes[i+1],seg=r.cum[i+1]-r.cum[i];let d=null;
    if(a===sn.a&&b===sn.b)d=r.cum[i]+sn.t*seg; else if(a===sn.b&&b===sn.a)d=r.cum[i]+(1-sn.t)*seg;
    if(d!==null&&d>=s0)return d;
  }
  return null;
}

// ---------- state ----------
const $=id=>document.getElementById(id);
let me=null,dest=null,paused=false,spi=0,best=null,simClock=0,toastT=null;
function toast(msg,ms){const t=$('toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),ms||2600);}
function setMe(sn){me=sn;$('mel').textContent='Near '+label(me);update();}
function setDest(sn){dest=sn;update();}

function evaluate(){
  const list=[];
  carts.forEach(c=>{
    c.ok=false;c.eta=null;
    const dm=routeDist(c.route,me,c.s);if(dm===null)return;           // already past you, or on another path
    let dd=null;
    if(dest){dd=routeDist(c.route,dest,dm);if(dd===null)return;}        // does not go on to your destination
    c.dm=dm;c.dd=dd;c.eta=(dm-c.s)/c.v;c.ok=!c.full;
    list.push(c);
  });
  list.sort((a,b)=>a.eta-b.eta);
  return list;
}
const mmss=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
const sorted=DATA.gaps.slice().sort((a,b)=>a-b),medGap=sorted[Math.floor(sorted.length/2)];
$('foot').textContent='Simulation, not live tracking. Based on '+DATA.gaps.length+' timed departures, median gap '+mmss(medGap);
function update(){
  if(!me)return;
  const list=evaluate(),good=list.filter(c=>c.ok);
  best=good[0]||null;
  $('trip').classList.toggle('none',!dest);
  if(dest){const toward=toB(dest)<toB(me)?'B':'A';
    $('dl').textContent='To '+label(dest);}
  else $('dl').textContent='Tap a road to set a destination';
  $('next').classList.toggle('none',!best);
  
  if(best){$('cd').textContent=mmss(best.eta);
    $('ns').textContent='Cart '+best.id+' to '+END_NAME[best.dir==='A'?'B':'A']+(dest?', ride about '+mmss((best.dd-best.dm)/best.v):'');}
  else{$('cd').textContent='--:--';$('ns').textContent=(dest?'None on that route right now':'None heading your way right now')+', one leaves about every '+mmss(medGap);}
  const rows=list.filter(c=>c!==best).slice(0,2),ul=$('list');
  while(ul.children.length<rows.length){const li=document.createElement('li');li.innerHTML='<span></span><span class="tag"></span><b></b>';ul.appendChild(li);}
  while(ul.children.length>rows.length)ul.lastChild.remove();
  rows.forEach((c,i)=>{const li=ul.children[i];li.className=c.ok?'':'f';li.children[0].textContent='Cart '+c.id;
    li.children[1].textContent=c.ok?'empty':'full';li.children[1].className='tag'+(c.ok?'':' n');li.children[2].textContent=mmss(c.eta);});
}

// ---------- drawing ----------
const cv=$('c'),ctx=cv.getContext('2d'),wrap=$('mapwrap');
const img=new Image();img.src='data:image/jpeg;base64,'+DATA.img;
const IW=820,IH=744;let view={s:1,x:0,y:0},dpr=1,W=0,H=0,t0=performance.now(),touched=false;
const BB=(()=>{let x0=1e9,y0=1e9,x1=0,y1=0;NODES.forEach(k=>{x0=Math.min(x0,N[k][0]);y0=Math.min(y0,N[k][1]);x1=Math.max(x1,N[k][0]);y1=Math.max(y1,N[k][1]);});return {x0:x0-30,y0:y0-34,x1:x1+30,y1:y1+34};})();
function size(){const r=wrap.getBoundingClientRect();dpr=Math.min(2,window.devicePixelRatio||1);const first=!W;
  if(r.width<2||r.height<2||(r.width===W&&r.height===H))return;
  if(!first){view.x+=(r.width-W)/2;view.y+=(r.height-H)/2;}
  W=r.width;H=r.height;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);if(first||!touched)fit();else clamp();}
function fit(){touched=false;const s=Math.min(W/(BB.x1-BB.x0),H/(BB.y1-BB.y0));view={s,x:W/2-(BB.x0+BB.x1)/2*s,y:H/2-(BB.y0+BB.y1)/2*s};}
function clamp(){view.s=Math.max(.4,Math.min(5,view.s)); // keep part of the campus on screen
  view.x=Math.max(W*.3-BB.x1*view.s,Math.min(W*.7-BB.x0*view.s,view.x));view.y=Math.max(H*.3-BB.y1*view.s,Math.min(H*.7-BB.y0*view.s,view.y));}
const toMap=(px,py)=>({x:(px-view.x)/view.s,y:(py-view.y)/view.s});
const SX=x=>view.x+x*view.s,SY=y=>view.y+y*view.s;
size();
if(window.ResizeObserver)new ResizeObserver(size).observe(wrap);else addEventListener('resize',size);

function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function text(t,x,y,col,px,align){ctx.font='600 '+(px||12)+'px system-ui,sans-serif';ctx.textAlign=align||'left';ctx.textBaseline='middle';
  if(align==='center'){const hw=ctx.measureText(t).width/2+4;x=Math.max(hw,Math.min(W-hw,x));}
  ctx.lineJoin='round';ctx.strokeStyle='#fff';ctx.lineWidth=3.5;ctx.strokeText(t,x,y);ctx.fillStyle=col;ctx.fillText(t,x,y);}
function drawRoads(){ // the cart route as one line: white casing under teal, so it reads on the busy map
  ctx.save();ctx.lineCap=ctx.lineJoin='round';ctx.beginPath();
  E.forEach(e=>{ctx.moveTo(SX(N[e[0]][0]),SY(N[e[0]][1]));ctx.lineTo(SX(N[e[1]][0]),SY(N[e[1]][1]));});
  const w=Math.max(2,2.4*view.s);ctx.globalAlpha=.85;ctx.strokeStyle='#fff';ctx.lineWidth=w+3;ctx.stroke();
  ctx.globalAlpha=.7;ctx.strokeStyle='#0F3D3E';ctx.lineWidth=w;ctx.stroke();ctx.restore();
}
function drawCart(c,now){
  const p=posAt(c.route,c.s),x=SX(p.x),y=SY(p.y),k=Math.max(.8,Math.min(1.5,view.s*1.25)),on=c.ok;
  const L=(on?19:15)*k,Wd=(on?11:8.5)*k;
  ctx.save();ctx.translate(x,y);
  if(c.flash>0){ctx.globalAlpha=c.flash*.8;ctx.strokeStyle='#E08A00';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(0,0,(1-c.flash)*22+8,0,7);ctx.stroke();}
  ctx.rotate(p.ang);ctx.globalAlpha=on?1:.5;
  rr(-L/2,-Wd/2,L,Wd,Wd*.4);ctx.fillStyle=c.full?'#E08A00':'#12924a';ctx.fill();
  ctx.lineWidth=on?2.2:1.2;ctx.strokeStyle='#fff';ctx.stroke();
  ctx.fillStyle='#fff';ctx.globalAlpha*=.95;ctx.beginPath();ctx.moveTo(L/2-2.5*k,0);ctx.lineTo(L/2-7*k,-Wd*.3);ctx.lineTo(L/2-7*k,Wd*.3);ctx.fill();
  ctx.restore();
  if(on&&c.eta!==null)text(mmss(c.eta),x+13*k,y-11*k,'#064e3b',12);
}
function pin(sn,col,txt){
  const x=SX(sn.x),y=SY(sn.y);
  ctx.save();ctx.fillStyle=col;ctx.globalAlpha=.2;ctx.beginPath();ctx.arc(x,y,15,0,7);ctx.fill();ctx.globalAlpha=1;
  ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y,7.5,0,7);ctx.fill();ctx.stroke();
  const right=x<W-90;text(txt,x+(right?13:-13),y-12,col,13,right?'left':'right');ctx.restore();
}
function drawEnds(){
  [[A_NODE,'A'],[V_NODE,'54'],[B_NODE,'B']].forEach(([k,l])=>{if(!k)return;const x=SX(N[k][0]),y=SY(N[k][1]);
    ctx.save();ctx.fillStyle='#fff';ctx.strokeStyle='#0F3D3E';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y,12,0,7);ctx.fill();ctx.stroke();
    ctx.fillStyle='#0F3D3E';ctx.font='600 '+(l.length>1?11:13)+'px system-ui,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(l,x,y+.5);ctx.restore();
    if(!DRAWN)text(END_NAME[l],x,y+(l==='A'&&y+32<H?24:-24),'#0F3D3E',12,'center');});
}
let lastEval=0;
function frame(now){
  requestAnimationFrame(frame);if(now-t0<30)return;
  const dt=Math.min(0.1,(now-t0)/1000);t0=now;
  if(!paused){
    const sd=dt*SPEEDS[spi];simClock+=sd;
    carts.forEach(c=>{c.s+=c.v*sd;if(c.flash>0)c.flash=Math.max(0,c.flash-dt*1.2);
      if(c.pickupAt!==null&&c.s>=c.pickupAt){c.full=true;c.pickupAt=null;c.flash=1;}});
    carts=carts.filter(c=>c.s<c.route.len);
    ['A','B'].forEach(d=>{spawnT[d]-=sd;if(spawnT[d]<=0){spawn(d,0);spawnT[d]+=nextGap();}});
  }
  if(now-lastEval>200){update();lastEval=now;}
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
  if(img.complete&&img.naturalWidth)ctx.drawImage(img,view.x,view.y,IW*view.s,IH*view.s);
  drawRoads();
  if(dest&&best&&best.dd!==null){ // the stretch the next empty cart will drive from you to your destination
    const r=best.route;ctx.save();ctx.strokeStyle='#2563eb';ctx.globalAlpha=.9;ctx.setLineDash([2,9]);ctx.lineWidth=5;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();
    for(let d=best.dm;;d+=3){const e=Math.min(d,best.dd),p=posAt(r,e);d===best.dm?ctx.moveTo(SX(p.x),SY(p.y)):ctx.lineTo(SX(p.x),SY(p.y));if(e>=best.dd)break;}
    ctx.stroke();ctx.restore();
  }
  drawEnds();
  carts.slice().sort((a,b)=>(a.ok?1:0)-(b.ok?1:0)).forEach(c=>drawCart(c,now));
  if(dest)pin(dest,'#dc2626','Destination');
  pin(me,'#2563eb','You');
  $('clock').textContent=paused?'Paused':'Simulation '+mmss(simClock);
}
setMe(snap(...(N.J4||N[mainPath[mainPath.length>>1]])));if(netNote)toast(netNote,5000);
requestAnimationFrame(frame);

// ---------- input: pan, pinch, tap, long-press ----------
const ptrs=new Map();let moved=false,startPt=null,pinch0=null,pressT=null,multi=false;
const loc=e=>{const r=wrap.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};};
function pick(pt){const m=toMap(pt.x,pt.y),sn=snap(m.x,m.y);
  if(sn.d*view.s>46){toast('Tap closer to the cart route');return null;}return sn;}
wrap.addEventListener('pointerdown',e=>{
  if(e.target.closest('#tools'))return;
  if(e.pointerType==='mouse'&&e.button!==0)return;
  try{wrap.setPointerCapture(e.pointerId);}catch(_){}
  const p=loc(e);ptrs.set(e.pointerId,p);clearTimeout(pressT);
  if(ptrs.size===1){moved=false;multi=false;startPt=p;
    pressT=setTimeout(()=>{if(!moved&&ptrs.size===1){const sn=pick(startPt);moved=true;if(sn){setMe(sn);toast('You are near '+label(sn),1800);if(navigator.vibrate)navigator.vibrate(15);}}},550);}
  else if(ptrs.size===2){multi=true;moved=true;const [a,b]=[...ptrs.values()];pinch0={d:Math.hypot(a.x-b.x,a.y-b.y)||1,s:view.s};}
});
wrap.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;const old=ptrs.get(e.pointerId),p=loc(e);
  if(ptrs.size>=2&&pinch0){
    const [a0,b0]=[...ptrs.values()],c0x=(a0.x+b0.x)/2,c0y=(a0.y+b0.y)/2;ptrs.set(e.pointerId,p);
    const [a,b]=[...ptrs.values()],d=Math.hypot(a.x-b.x,a.y-b.y),cx=(a.x+b.x)/2,cy=(a.y+b.y)/2;
    const ns=Math.max(.4,Math.min(5,pinch0.s*d/pinch0.d)),k=ns/view.s;
    view.x=cx-(c0x-view.x)*k;view.y=cy-(c0y-view.y)*k;view.s=ns;touched=true;clamp();return;}
  if(!moved&&Math.hypot(p.x-startPt.x,p.y-startPt.y)>10){moved=true;clearTimeout(pressT);}
  if(moved&&!multi){view.x+=p.x-old.x;view.y+=p.y-old.y;touched=true;clamp();}
  ptrs.set(e.pointerId,p);
});
function up(e){
  if(!ptrs.has(e.pointerId))return;clearTimeout(pressT);
  if(e.type==='pointerup'&&!moved&&ptrs.size===1){const sn=pick(loc(e));if(sn)setDest(sn);}
  ptrs.delete(e.pointerId);if(ptrs.size<2)pinch0=null;
}
wrap.addEventListener('pointerup',up);wrap.addEventListener('pointercancel',up);
wrap.addEventListener('contextmenu',e=>e.preventDefault());
wrap.addEventListener('wheel',e=>{e.preventDefault();const p=loc(e),ns=Math.max(.4,Math.min(5,view.s*(e.deltaY<0?1.15:.87))),k=ns/view.s;
  view.x=p.x-(p.x-view.x)*k;view.y=p.y-(p.y-view.y)*k;view.s=ns;touched=true;clamp();},{passive:false});

// ---------- buttons ----------
$('pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Resume':'Pause';};
$('spd').onclick=e=>{spi=(spi+1)%SPEEDS.length;e.target.textContent=SPEEDS[spi]+'×';};
$('fit').onclick=fit;
$('clear').onclick=()=>setDest(null);
$('gps').onclick=()=>{
  const btn=$('gps'),fail=m=>{btn.textContent='Locate me';toast(m+'. Long-press the map to set where you are',4200);};
  if(!navigator.geolocation){fail('GPS is not available here');return;}
  btn.textContent='Finding...';
  navigator.geolocation.getCurrentPosition(pos=>{
    const {latitude:la,longitude:lo}=pos.coords,a=GPS.a,b=GPS.b;
    // project the GPS fix onto the A-B line, then place the point that far along the main road
    const mx=111320*Math.cos(la*Math.PI/180),ax=(lo-a.lon)*mx,ay=(la-a.lat)*110540,bx=(b.lon-a.lon)*mx,by=(b.lat-a.lat)*110540;
    const t=(ax*bx+ay*by)/(bx*bx+by*by);
    if(Math.abs(la-a.lat)>GPS.box||Math.abs(lo-a.lon)>GPS.box||t<-.15||t>1.15){fail('You seem to be outside the campus');return;}
    btn.textContent='Locate me';
    const r=gpsRoute,p=posAt(r,Math.max(0,Math.min(1,t))*r.len);
    setMe(snap(p.x,p.y));toast('Roughly near '+label(me));
  },err=>fail('Could not get your location'),{enableHighAccuracy:true,timeout:10000});
};
</script>
<script>if("serviceWorker"in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{})</script>
